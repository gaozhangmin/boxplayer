name: Promote Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要转为正式 Release 的 tag，例如 v5.0.1'
        required: true
        type: string

concurrency:
  group: promote-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Pre-release To Release
    runs-on: ubuntu-latest
    environment: production-release
    outputs:
      newly_published: ${{ steps.publish.outputs.newly_published }}
    permissions:
      contents: write

    steps:
      - name: Promote GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
        shell: bash
        run: |
          # The by-tag REST endpoint may return 404 for an existing draft.
          # List releases with write credentials, then publish the exact draft by ID.
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp | python3 -c 'import json, os, sys; matches = [r for page in json.load(sys.stdin) for r in page if r["tag_name"] == os.environ["TAG_NAME"]]; assert len(matches) == 1, "Expected exactly one release"; print(matches[0]["id"])')"
          was_public="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '(.draft == false and .prerelease == false)')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F prerelease=false \
            -F draft=false \
            -f make_latest=true

          if [[ "${was_public}" != "true" ]]; then
            echo "newly_published=true" >> "$GITHUB_OUTPUT"
          fi

  announce-discord:
    name: Announce release in Discord
    needs: promote
    if: needs.promote.outputs.newly_published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
