name: Validate embedded MPV Windows x64 candidate

on:
  workflow_call:
    inputs:
      real_cloud:
        description: Run the release-blocking real cloud provider matrix
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      real_cloud:
        description: Run the real cloud provider matrix
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/mpv-runner-validation

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Preserve Unix line endings for MSYS2 build scripts
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install project dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec electron-rebuild -f -w better-sqlite3
          pnpm --dir native/boxplayer-mpv-texture install --ignore-workspace --no-frozen-lockfile --ignore-scripts

      - name: Verify MPV playback header and proxy contracts
        run: |
          pnpm exec vitest run `
            src/utils/__tests__/playbackHeaders.test.ts `
            src/utils/__tests__/proxyMediaRewrite.test.ts `
            src/utils/__tests__/proxyhelper.test.ts `
            electron/main/core/__tests__/embeddedMpvLoadOptions.test.ts

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git curl
            mingw-w64-clang-x86_64-cc
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-libplacebo
            mingw-w64-clang-x86_64-libass

      - name: Build official mpv source and stage runtime dependency closure
        shell: msys2 {0}
        run: bash native/boxplayer-mpv-texture/scripts/build-mpv-source-win-x64-msys2.sh

      - name: Build and smoke-test the native addon
        run: |
          pnpm --dir native/boxplayer-mpv-texture run build:libmpv
          pnpm --dir native/boxplayer-mpv-texture run smoke:controls

      - name: Bundle and verify x64 candidate
        run: |
          pnpm --dir native/boxplayer-mpv-texture run bundle:software
          node scripts/check-embedded-mpv-bundles.mjs win32/x64

      - name: Diagnose native software playback
        run: node native/boxplayer-mpv-texture/scripts/smoke-playback.mjs

      - name: Diagnose Electron native software playback
        run: pnpm exec electron e2e/embeddedMpvNativeSmoke.cjs

      - name: Verify visible playback in production Electron entry
        env:
          BOXPLAYER_MPV_REQUIRE_E2E: '1'
        run: |
          pnpm run pretest:e2e
          pnpm exec playwright test e2e/embeddedMpvPlayback.spec.ts e2e/embeddedMpvWindowsCdp.spec.ts e2e/embeddedMpvControlsCdp.spec.ts --workers=1

      - name: Validate real cloud and Emby test coverage
        if: inputs.real_cloud == true
        env:
          BOXPLAYER_E2E_ACCOUNTS_JSON: ${{ secrets.BOXPLAYER_E2E_ACCOUNTS_WINDOWS_X64_JSON || secrets.BOXPLAYER_E2E_ACCOUNTS_JSON }}
          BOXPLAYER_E2E_TARGETS_JSON: ${{ secrets.BOXPLAYER_E2E_TARGETS_JSON }}
          BOXPLAYER_E2E_MEDIA_FOLDER: ${{ vars.BOXPLAYER_E2E_MEDIA_FOLDER }}
          BOXPLAYER_E2E_MEDIA_FILE: ${{ vars.BOXPLAYER_E2E_MEDIA_FILE }}
          BOXPLAYER_E2E_EMBY_JSON: ${{ secrets.BOXPLAYER_E2E_EMBY_JSON }}
        run: |
          node scripts/real-cloud-e2e-config.cjs
          node scripts/real-media-server-e2e-config.cjs

      - name: Build production renderer with real provider credentials
        if: inputs.real_cloud == true
        env:
          ALIYUN_APP_ID: ${{ secrets.ALIYUN_APP_ID }}
          ALIYUN_APP_SECRET: ${{ secrets.ALIYUN_APP_SECRET }}
          BAIDU_APP_ID: ${{ secrets.BAIDU_APP_ID }}
          BAIDU_APP_SECRET: ${{ secrets.BAIDU_APP_SECRET }}
          BAIDU_PCS_APP_ID: ${{ secrets.BAIDU_PCS_APP_ID }}
          CLOUD123_APP_ID: ${{ secrets.CLOUD123_APP_ID }}
          CLOUD123_APP_SECRET: ${{ secrets.CLOUD123_APP_SECRET }}
          DRIVE115_APP_ID: ${{ secrets.DRIVE115_APP_ID }}
          DRIVE115_APP_SECRET: ${{ secrets.DRIVE115_APP_SECRET }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PIKPAK_CLIENT_ID: ${{ secrets.PIKPAK_CLIENT_ID }}
          PIKPAK_CLIENT_SECRET: ${{ secrets.PIKPAK_CLIENT_SECRET }}
          GUANGYA_CLIENT_ID: ${{ secrets.GUANGYA_CLIENT_ID }}
          CLOUD189_APP_ID: ${{ secrets.CLOUD189_APP_ID }}
        run: |
          node scripts/generate-secrets.mjs --mode=ci
          pnpm exec vite build

      - name: Verify every cloud provider and Emby through the real MPV path
        if: inputs.real_cloud == true
        env:
          BOXPLAYER_E2E_ACCOUNTS_JSON: ${{ secrets.BOXPLAYER_E2E_ACCOUNTS_WINDOWS_X64_JSON || secrets.BOXPLAYER_E2E_ACCOUNTS_JSON }}
          BOXPLAYER_E2E_TARGETS_JSON: ${{ secrets.BOXPLAYER_E2E_TARGETS_JSON }}
          BOXPLAYER_E2E_MEDIA_FOLDER: ${{ vars.BOXPLAYER_E2E_MEDIA_FOLDER }}
          BOXPLAYER_E2E_MEDIA_FILE: ${{ vars.BOXPLAYER_E2E_MEDIA_FILE }}
          BOXPLAYER_E2E_EMBY_JSON: ${{ secrets.BOXPLAYER_E2E_EMBY_JSON }}
          BOXPLAYER_E2E_REAL: '1'
          BOXPLAYER_E2E_REAL_MPV: '1'
          BOXPLAYER_MPV_REQUIRE_E2E: '1'
        run: pnpm exec playwright test e2e/realCloudProviders.spec.ts e2e/realMediaServerMpv.spec.ts --workers=1

      - name: Verify the unpacked Electron package contains the complete bundle
        run: |
          pnpm exec electron-builder --win --dir --x64
          node scripts/check-packaged-mpv.mjs win32 x64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-mpv-windows-x64-candidate
          path: static/engine/win32/x64/mpv-texture/
          if-no-files-found: warn
