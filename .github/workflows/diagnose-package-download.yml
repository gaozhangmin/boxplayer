name: Diagnose package download
on:
  workflow_dispatch:
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: node scripts/install-ci-dependencies.mjs
      - run: node scripts/generate-secrets.mjs --mode=local
      - run: pnpm exec vite build
      - name: Trace the actual packager download
        env:
          DEBUG: electron-builder,@electron/get*
        run: |
          node -e 'const c=require("./electron-builder.json"); console.log(JSON.stringify({electronDownload:c.electronDownload}))'
          pnpm exec electron-builder --linux --dir --publish never
