name: Validate embedded MPV Linux candidates

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - codex/mpv-runner-validation

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Linux build and playback dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config patchelf \
            gdb \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libplacebo-dev libass-dev \
            libpulse-dev xvfb

      - name: Install project dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir native/boxplayer-mpv-texture install --ignore-workspace --no-frozen-lockfile --ignore-scripts

      - name: Verify MPV playback header and proxy contracts
        run: |
          pnpm exec vitest run \
            src/utils/__tests__/playbackHeaders.test.ts \
            src/utils/__tests__/proxyMediaRewrite.test.ts \
            src/utils/__tests__/proxyhelper.test.ts \
            electron/main/core/__tests__/embeddedMpvLoadOptions.test.ts

      - name: Build official libmpv and software renderer addon
        run: |
          pnpm --dir native/boxplayer-mpv-texture run source:linux
          pnpm --dir native/boxplayer-mpv-texture run build:libmpv
          pnpm --dir native/boxplayer-mpv-texture run smoke:controls

      - name: Bundle and verify target architecture
        run: |
          pnpm --dir native/boxplayer-mpv-texture run bundle:software
          node scripts/check-embedded-mpv-bundles.mjs linux/${{ matrix.arch }}
          ldd static/engine/linux/${{ matrix.arch }}/mpv-texture/mpv_texture.node
          ldd static/engine/linux/${{ matrix.arch }}/mpv-texture/libmpv.so.2

      - name: Diagnose native software playback
        run: |
          gdb -batch -ex run -ex 'thread apply all bt 12' --args \
            node native/boxplayer-mpv-texture/scripts/smoke-playback.mjs

      - name: Verify visible playback in production Electron entry
        env:
          BOXPLAYER_MPV_REQUIRE_E2E: '1'
          BOXPLAYER_MPV_AUDIO_OUTPUT: 'null'
        run: |
          pnpm run pretest:e2e
          sudo sysctl -w kernel.core_pattern="$PWD/core.%e.%p"
          ulimit -c unlimited
          set +e
          xvfb-run -a pnpm exec playwright test e2e/embeddedMpvPlayback.spec.ts e2e/embeddedMpvControlsCdp.spec.ts --workers=1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            for core in core.mpv-node-host.*; do
              if [ -f "$core" ]; then
                gdb -batch -ex 'thread apply all bt 24' static/engine/linux/${{ matrix.arch }}/mpv-texture/mpv-node-host "$core" || true
              fi
            done
          fi
          exit "$status"

      - name: Verify the unpacked Electron package contains the complete bundle
        run: |
          pnpm exec electron-builder --linux --dir
          node scripts/check-packaged-mpv.mjs linux ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-mpv-linux-${{ matrix.arch }}-candidate
          path: static/engine/linux/${{ matrix.arch }}/mpv-texture/
          if-no-files-found: warn
